# The demo film, made without anybody's laptop.
#
# Which film follows the brand's demo: a tour of the whole platform for a full-portal demo,
# the assistant answering for an assistant-only one. The recorder reads that off the portal
# itself; `mode` overrides it.
#
# The recorder needs a browser and a video encoder. A GitHub runner has both — Chromium
# through Playwright, ffmpeg preinstalled — so the film can be made on demand, or on a
# schedule, by something that is not a person's Mac.
#
# It fetches the brand's demo login and posts the finished film back to the decks bucket
# itself, where it appears in the commercial cycle's artefact list. The only things this
# workflow has to be told are which brand, and the two secrets that let it talk to the
# platform at all.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   AION_FUNCTIONS_BASE   https://<project>.supabase.co/functions/v1
#   AION_BATCH_SECRET     the KNOWLEDGE_BATCH_SECRET the functions check
#   AION_ANON_KEY         the project's anon key (the gateway wants a JWT)
#   AION_PORTAL_BASE      https://dev.app.aioncover.com

name: Demo video

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Brand slug, as in /<slug>/assistant"
        required: true
        type: string
      brand_id:
        description: "Brand id — used to fetch the demo login and to file the film"
        required: true
        type: string
      mode:
        description: "portal = the platform tour, assistant = the assistant film. Empty = whatever the brand's demo is set to"
        required: false
        default: ""
        type: string
      questions:
        description: "How many questions to ask (assistant film only)"
        required: false
        default: "3"
        type: string
      fps:
        description: "Frames per second of the film. 30: in slow motion every frame is a fresh paint, and thirty fresh frames a second is smooth; 60 would double the recording for frames the runner cannot paint apart"
        required: false
        default: "30"
        type: string
      speed:
        description: "Playback speed of what moves on screen (the waits for answers are sped up on their own to fit two and a half minutes). 1 is smooth on the runner; above it the film stutters"
        required: false
        default: "1"
        type: string
      scale:
        description: "Render scale of the page (CSS 1440×900 × this). 1.5 is the default; 1.333 rasterises exactly 1920 wide, fewer pixels for the runner's software compositor to paint per frame"
        required: false
        default: "1.5"
        type: string
      ask:
        description: 'Override the questions, pipe separated. Empty = the brand''s own opening prompts'
        required: false
        default: ""
        type: string
      slow:
        description: "Slow-motion factor. The runner's Chrome paints ~15 fps, so the page runs this many times slower than the film and the cut speeds it back up: at 8 and 30 fps, four fresh paints per film frame. 1 = real time (a Mac)"
        required: false
        type: string
        default: "8"
      target:
        description: "dev or prod — which project's portal to film and file the film in. Each is a GitHub Environment holding that project's four AION_* secrets (repo-level ones are dev's)"
        required: false
        default: "dev"
        type: string
      upload:
        description: "File it against the brand as well as attaching it here"
        required: false
        default: true
        type: boolean

# One film per brand at a time. Two runs would drive the same demo login in two browsers and
# interleave their questions into each other's transcript.
concurrency:
  group: demo-video-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  record:
    # A Mac, not Ubuntu. Headless Chrome on the Linux runner painted about twenty-four frames
    # a second and the film could only ever be that; on Apple Silicon it paints sixty, and a
    # pan at sixty is the difference between smooth and "a bit scattery". Chrome is on the
    # image already, at the path the recorder looks in first; macOS runners are free on a
    # public repository.
    runs-on: macos-15
    # prod's AION_* secrets live on the "prod" environment and override the repo-level (dev) ones.
    environment: ${{ inputs.target == 'prod' && 'prod' || 'dev' }}
    # A slow answer is normal; a hung one should not hold a runner all day.
    timeout-minutes: 35
    # Not the last word on the run: `record-linux` takes over when this job never got a
    # runner, and `film` below decides whether the run passed.
    continue-on-error: true
    outputs:
      started: ${{ steps.start.outputs.started }}
      done: ${{ steps.done.outputs.done }}
    steps:
      # The first thing a runner does, so its absence means no runner ever took the job.
      - id: start
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: ./.github/actions/record-demo
        with:
          slug: ${{ inputs.slug }}
          brand_id: ${{ inputs.brand_id }}
          mode: ${{ inputs.mode }}
          questions: ${{ inputs.questions }}
          fps: ${{ inputs.fps }}
          speed: ${{ inputs.speed }}
          scale: ${{ inputs.scale }}
          ask: ${{ inputs.ask }}
          slow: ${{ inputs.slow }}
          upload: ${{ inputs.upload }}
          portal_base: ${{ secrets.AION_PORTAL_BASE }}
          functions_base: ${{ secrets.AION_FUNCTIONS_BASE }}
          batch_secret: ${{ secrets.AION_BATCH_SECRET }}
          anon_key: ${{ secrets.AION_ANON_KEY }}

      - id: done
        run: echo "done=true" >> "$GITHUB_OUTPUT"

  # The same film on Ubuntu, only when GitHub had no Mac to give.
  #
  # On 2026-11-23 the Mac job sat in the queue for fifteen minutes ("capacity constraints,
  # jobs targeting macOS arm64 runners"), was cancelled by GitHub without running a step, and
  # the brand page that had pressed Record got no film and no word of why. Ubuntu runners
  # are not short. Its Chrome paints fewer frames a second than the Mac's, which is what
  # `slow` is for: the page runs eight times slower than the film, so every film frame is
  # still a fresh paint.
  #
  # Only when the Mac job never started. One that started and failed has a reason of its
  # own, and a second runner would spend twenty minutes failing the same way.
  #
  # `always()` and not `!cancelled()`: whether GitHub counts its own cancellation of the
  # queued job as the run being cancelled is not written down anywhere, and the cost of
  # guessing wrong is this job never running. The price is that cancelling a run by hand
  # while the Mac job is still queued starts this one; cancel again.
  record-linux:
    needs: record
    if: ${{ always() && needs.record.outputs.started != 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'prod' && 'prod' || 'dev' }}
    timeout-minutes: 35
    outputs:
      done: ${{ steps.done.outputs.done }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/record-demo
        with:
          slug: ${{ inputs.slug }}
          brand_id: ${{ inputs.brand_id }}
          mode: ${{ inputs.mode }}
          questions: ${{ inputs.questions }}
          fps: ${{ inputs.fps }}
          speed: ${{ inputs.speed }}
          scale: ${{ inputs.scale }}
          ask: ${{ inputs.ask }}
          slow: ${{ inputs.slow }}
          upload: ${{ inputs.upload }}
          portal_base: ${{ secrets.AION_PORTAL_BASE }}
          functions_base: ${{ secrets.AION_FUNCTIONS_BASE }}
          batch_secret: ${{ secrets.AION_BATCH_SECRET }}
          anon_key: ${{ secrets.AION_ANON_KEY }}

      - id: done
        run: echo "done=true" >> "$GITHUB_OUTPUT"

  # The run's verdict: green when either job made the film, red when neither did. The Mac
  # job is allowed to fail so that a missing runner is not a failed run — which would also
  # hide a recorder that really broke, were it not for this.
  film:
    needs: [record, record-linux]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          MAC_STARTED: ${{ needs.record.outputs.started }}
          MAC_DONE: ${{ needs.record.outputs.done }}
          LINUX_DONE: ${{ needs.record-linux.outputs.done }}
        run: |
          if [ "$MAC_DONE" = "true" ]; then
            echo "Recorded on the Mac runner." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$LINUX_DONE" = "true" ]; then
            echo "No Mac runner was available; recorded on Ubuntu instead." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$MAC_STARTED" = "true" ]; then
            echo "::error::The recording failed on the Mac runner — see the record job."
            exit 1
          else
            echo "::error::No Mac runner was available, and the Ubuntu recording failed — see the record-linux job."
            exit 1
          fi
