# The demo film, made without anybody's laptop.
#
# Which film follows the brand's demo: a tour of the whole platform for a full-portal demo,
# the assistant answering for an assistant-only one. The recorder reads that off the portal
# itself; `mode` overrides it.
#
# The recorder needs a browser and a video encoder. A GitHub runner has both — Chromium
# through Playwright, ffmpeg preinstalled — so the film can be made on demand, or on a
# schedule, by something that is not a person's Mac.
#
# It fetches the brand's demo login and posts the finished film back to the decks bucket
# itself, where it appears in the commercial cycle's artefact list. The only things this
# workflow has to be told are which brand, and the two secrets that let it talk to the
# platform at all.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   AION_FUNCTIONS_BASE   https://<project>.supabase.co/functions/v1
#   AION_BATCH_SECRET     the KNOWLEDGE_BATCH_SECRET the functions check
#   AION_ANON_KEY         the project's anon key (the gateway wants a JWT)
#   AION_PORTAL_BASE      https://dev.app.aioncover.com

name: Demo video

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Brand slug, as in /<slug>/assistant"
        required: true
        type: string
      brand_id:
        description: "Brand id — used to fetch the demo login and to file the film"
        required: true
        type: string
      mode:
        description: "portal = the platform tour, assistant = the assistant film. Empty = whatever the brand's demo is set to"
        required: false
        default: ""
        type: string
      questions:
        description: "How many questions to ask (assistant film only)"
        required: false
        default: "3"
        type: string
      speed:
        description: "Playback speed of what moves on screen (the waits for answers are sped up on their own to fit two minutes). 1 is smooth on the runner; above it the film stutters"
        required: false
        default: "1"
        type: string
      ask:
        description: 'Override the questions, pipe separated. Empty = the brand''s own opening prompts'
        required: false
        default: ""
        type: string
      target:
        description: "dev or prod — which project's portal to film and file the film in. Each is a GitHub Environment holding that project's four AION_* secrets (repo-level ones are dev's)"
        required: false
        default: "dev"
        type: string
      upload:
        description: "File it against the brand as well as attaching it here"
        required: false
        default: true
        type: boolean

# One film per brand at a time. Two runs would drive the same demo login in two browsers and
# interleave their questions into each other's transcript.
concurrency:
  group: demo-video-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    # prod's AION_* secrets live on the "prod" environment and override the repo-level (dev) ones.
    environment: ${{ inputs.target == 'prod' && 'prod' || 'dev' }}
    # A slow answer is normal; a hung one should not hold a runner all day.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Chromium only. The other two engines are a few hundred megabytes this never opens.
      #
      # Skipped where the runner image already has Google Chrome — the recorder looks for
      # /usr/bin/google-chrome before Playwright's own download (scripts/demo-video.mjs), so
      # the download was never used there, and its `--with-deps` goes through apt: 13 minutes
      # on 2026-10-23, when the Ubuntu mirror was crawling.
      - name: Install Chromium (only when the image has no Chrome)
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            /usr/bin/google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi

      # ffmpeg is NOT on ubuntu-latest — it was on the older images and is not on 24.04, so
      # the first run drove the whole demo, asked all three questions, waited for every
      # answer, and then died on `spawnSync ffmpeg ENOENT` at the encode. Two minutes of live
      # assistant thrown away at the last step.
      #
      # A static build off GitHub's own release storage first, apt only as the fallback. On
      # 2026-10-23 the Ubuntu mirror was so slow that `apt-get update` alone hung past the
      # job's 25 minutes, twice, and Brunello Cucinelli's film was never recorded. The
      # download is one request to the same network the runner is on.
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          if curl -fsSL --max-time 120 -o /tmp/ffmpeg.tar.xz \
               https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
             && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp; then
            # ffprobe too: the recorder reads the film's length with it before uploading, and
            # the apt package carried both — the first run on this download recorded the whole
            # film and then died on `spawnSync ffprobe ENOENT`.
            sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          else
            timeout 300 sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Record
        env:
          AION_FUNCTIONS_BASE: ${{ secrets.AION_FUNCTIONS_BASE }}
          AION_BATCH_SECRET: ${{ secrets.AION_BATCH_SECRET }}
          AION_ANON_KEY: ${{ secrets.AION_ANON_KEY }}
        run: |
          node scripts/demo-video.mjs \
            --slug "${{ inputs.slug }}" \
            --brand-id "${{ inputs.brand_id }}" \
            --base "${{ secrets.AION_PORTAL_BASE }}" \
            --questions "${{ inputs.questions }}" \
            --speed "${{ inputs.speed }}" \
            ${{ inputs.ask != '' && format('--ask "{0}"', inputs.ask) || '' }} \
            ${{ inputs.mode != '' && format('--mode "{0}"', inputs.mode) || '' }} \
            ${{ inputs.upload && '--upload' || '' }}

      # Also attached here, so a failed upload does not lose the recording — it is the
      # expensive part of this job.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-video-${{ inputs.slug }}
          path: AION-*.mp4
          if-no-files-found: warn
          retention-days: 30
