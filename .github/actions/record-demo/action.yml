# The recording itself: everything after checkout, on whichever runner the job landed on.
#
# It is an action and not steps in the workflow because the workflow runs it from two jobs —
# the Mac, and the Ubuntu job that takes over when GitHub has no Mac to give — and the two
# must not drift apart. The job checks the repository out first; a local action cannot be
# found before that.

name: Record the demo film
description: Install what the recorder needs, record the film, attach it to the run

inputs:
  slug: { required: true, description: "Brand slug" }
  brand_id: { required: true, description: "Brand id" }
  mode: { required: false, default: "", description: "portal, assistant, or empty" }
  questions: { required: false, default: "3", description: "Questions to ask" }
  fps: { required: false, default: "30", description: "Frames per second" }
  speed: { required: false, default: "1", description: "Playback speed" }
  scale: { required: false, default: "1.5", description: "Render scale" }
  ask: { required: false, default: "", description: "Questions, pipe separated" }
  slow: { required: false, default: "8", description: "Slow-motion factor" }
  upload: { required: false, default: "true", description: "File it against the brand" }
  portal_base: { required: true, description: "AION_PORTAL_BASE" }
  functions_base: { required: true, description: "AION_FUNCTIONS_BASE" }
  batch_secret: { required: true, description: "AION_BATCH_SECRET" }
  anon_key: { required: true, description: "AION_ANON_KEY" }

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm

    - run: npm ci
      shell: bash

    # Chromium only. The other two engines are a few hundred megabytes this never opens.
    #
    # Skipped where the runner image already has Google Chrome — the recorder looks for
    # it before Playwright's own download (scripts/demo-video.mjs), so the download was
    # never used there, and its `--with-deps` goes through apt: 13 minutes on 2026-10-23,
    # when the Ubuntu mirror was crawling.
    - name: Install Chromium (only when the image has no Chrome)
      shell: bash
      run: |
        if [ -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
        elif [ -x /usr/bin/google-chrome ]; then
          /usr/bin/google-chrome --version
        else
          npx playwright install --with-deps chromium
        fi

    # ffmpeg is NOT on ubuntu-latest — it was on the older images and is not on 24.04, so
    # the first run drove the whole demo, asked all three questions, waited for every
    # answer, and then died on `spawnSync ffmpeg ENOENT` at the encode. Two minutes of live
    # assistant thrown away at the last step.
    #
    # A static build off GitHub's own release storage first, apt only as the fallback. On
    # 2026-10-23 the Ubuntu mirror was so slow that `apt-get update` alone hung past the
    # job's 25 minutes, twice, and Brunello Cucinelli's film was never recorded. The
    # download is one request to the same network the runner is on.
    #
    # A composite step cannot carry its own timeout, so the slow paths are bounded here:
    # `timeout` on apt, `--max-time` on the download.
    - name: Install ffmpeg
      shell: bash
      run: |
        if [ "$(uname)" = "Darwin" ]; then
          # Homebrew's bottle; the macOS image has brew and no ffmpeg.
          brew install --quiet ffmpeg
          ffmpeg -version | head -1; ffprobe -version | head -1
          exit 0
        fi
        if curl -fsSL --max-time 120 -o /tmp/ffmpeg.tar.xz \
             https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
           && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp; then
          # ffprobe too: the recorder reads the film's length with it before uploading, and
          # the apt package carried both — the first run on this download recorded the whole
          # film and then died on `spawnSync ffprobe ENOENT`.
          sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
        else
          timeout 300 sudo apt-get update -qq
          timeout 300 sudo apt-get install -y -qq ffmpeg
        fi
        ffmpeg -version | head -1
        ffprobe -version | head -1

    # Everything typed into the form reaches the shell as an environment variable, never as
    # text pasted into the script, so a question with a quote in it is still one argument.
    - name: Record
      shell: bash
      env:
        AION_FUNCTIONS_BASE: ${{ inputs.functions_base }}
        AION_BATCH_SECRET: ${{ inputs.batch_secret }}
        AION_ANON_KEY: ${{ inputs.anon_key }}
        IN_SLUG: ${{ inputs.slug }}
        IN_BRAND_ID: ${{ inputs.brand_id }}
        IN_BASE: ${{ inputs.portal_base }}
        IN_QUESTIONS: ${{ inputs.questions }}
        IN_SPEED: ${{ inputs.speed }}
        IN_FPS: ${{ inputs.fps }}
        IN_SCALE: ${{ inputs.scale }}
        IN_SLOW: ${{ inputs.slow }}
        IN_ASK: ${{ inputs.ask }}
        IN_MODE: ${{ inputs.mode }}
        IN_UPLOAD: ${{ inputs.upload }}
      run: |
        args=(
          --slug "$IN_SLUG"
          --brand-id "$IN_BRAND_ID"
          --base "$IN_BASE"
          --questions "$IN_QUESTIONS"
          --speed "$IN_SPEED"
          --fps "$IN_FPS"
          --scale "$IN_SCALE"
          --slow "$IN_SLOW"
        )
        if [ -n "$IN_ASK" ]; then args+=(--ask "$IN_ASK"); fi
        if [ -n "$IN_MODE" ]; then args+=(--mode "$IN_MODE"); fi
        if [ "$IN_UPLOAD" = "true" ]; then args+=(--upload); fi
        node scripts/demo-video.mjs "${args[@]}"

    # Also attached here, so a failed upload does not lose the recording — it is the
    # expensive part of this job.
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: demo-video-${{ inputs.slug }}
        path: AION-*.mp4
        if-no-files-found: warn
        retention-days: 30
